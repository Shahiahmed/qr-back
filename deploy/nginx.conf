# API for the QR menu. Port 8082 — 8080 and 8081 belong to other projects on
# this box, so this must not be changed without checking what is free.
#
# Install:
#   cp deploy/nginx.conf /etc/nginx/sites-available/qr-menu
#   ln -s /etc/nginx/sites-available/qr-menu /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 8082;
    server_name _;
    root /var/www/qr-menu/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Dish photos come off phones at 3-5 MB; the PHP limits are raised to match.
    client_max_body_size 20M;

    index index.php;
    charset utf-8;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
